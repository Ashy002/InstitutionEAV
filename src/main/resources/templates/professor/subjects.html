<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section})}">
<section>
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="m-0">📚 Mes matières</h1>
    <a class="btn btn-outline-primary" th:href="@{/professor/dashboard}">← Retour</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr><th>Matière</th><th class="text-center">Coefficient</th><th class="text-end">Action</th></tr>
      </thead>
      <tbody>
        <tr th:each="s : ${subjects}">
          <td th:text="${s.name}">Math</td>
          <td class="text-center"><span class="badge bg-primary" th:text="${s.coefficient}">1</span></td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-success" th:href="@{/professor/grades/new}">+ Saisir note</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(subjects)}">
          <td colspan="3" class="text-center text-muted fst-italic">Aucune matière assignée</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="alert alert-info small mt-3">
    ℹ️ L'assignation des matières s'effectue via l'administrateur.
  </div>
</section>
</html>
